{% extends "layout.html" %}
{% block head%}

<style>
   .main-container{
      margin:0;
      min-height:70vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#ffffff;
   }
   .main{
      text-align: center;
   }
     #signing_container {
        display:flex; 
        justify-content: center; 
        flex-direction:column;
        align-items:center; 
        gap: 10px;

     }
     input{
             text-align: center;
             width: 450px;
             height: 40px;
             font-size: 16px;
             padding: 5px;
             border-radius:12px;
             border-color: black;
             box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.3);

        }
        h1{
         text-align: center;
        }
        .submit{
            width: 200px;
            height: 40px;
            background:#6d4aff;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:12px;
            font-size:16px;
            cursor:pointer;
        }
        .dark, .dark .main-container{
         background-color: #121212;
         color:white;
        }
</style>

{% endblock head %}


{% block content %}
{% block nav %} {{super()}} {% endblock nav %}
<div class="main-container">
<div class="main">
<h1>What should we call you</h1>
<form action="#" method="POST">
<div id="signing_container">
    <input type="text" name="name" placeholder="Drop your name here" required>
    <input class="submit" type="submit"  value="Start">
</div>
</form>
</div>
</div>
{% block script %} {{super()}} {% endblock script %}
{%endblock%}
