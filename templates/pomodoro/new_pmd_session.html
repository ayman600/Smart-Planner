{% extends "layout.html" %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pomodoro/new_pmd_session.css') }}">
{% endblock head %}
{% block content %}
<div class="pomodoro">
    {% block sidebar %} {{ super() }} {% endblock sidebar %}
    <main>
        <h1>New Sessi<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 30 130 150" class="pomodoro-icon"><path d="M 100 45 C 115 25, 140 30, 135 50 C 120 55, 105 45, 100 45 Z" fill="#2e7d32" /><path d="M 100 45 Q 98 35 95 30" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" fill="none" /><circle cx="100" cy="115" r="60" fill="#e53935" /><path d="M 70 80 A 45 45 0 0 1 120 70" stroke="#ff8a80" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" /></svg>n</h1>
        <form class="add-card" action="{{ url_for('new_pmd_session') }}" method="POST">
            <label>Title</label>
            <input type="text" name="title" placeholder="math focus...">

            <label>Time</label>
            <div class="ruler-wrapper">
                <canvas class="canvas" id="time-ruler" height="75"></canvas>
            </div>
            <div class="time">
                <input type="number" name="hours" max="99" value="00">
                <p>:</p>
                <input type="number" name="minutes" max="59" value="05" required>
                <p>:</p>
                <input type="number" name="seconds" max="59" value="00">
            </div>

            <label>Description</label>
            <input type="text" name="description" placeholder="Objectifs of the session">

            <label>Link a Project</label>
            <select name="project">
                    <option>None</option>
                {% for project in projects %}
                    <option value="{{project.id}}">{{project.title}}</option>
                {% endfor %}
            </select>

            <div class="add-task">
                <label>Add tasks</label>
                <button type="button" id="add-task-btn" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="40px" width="24px" fill="#e3e3e3"><path d="M11,13H5V11h6V5h2v6h6v2H13v6H11V13Z"/></svg></button> 
            </div>
                
            
            <div id="tasks-container">
                <div class="task-input-group">
                </div>
            </div>

            <button class="submit" type="submit">Start</button>
        </form>
    </main>
</div>
<script>
document.addEventListener('click', (e) => {
    if (e.target.closest('#add-task-btn')) {
        const container = document.getElementById('tasks-container');
        const taskGroup = document.createElement('div');
        taskGroup.className = 'task-input-group';
        taskGroup.innerHTML = `
            <input type="text" name="tasks" placeholder="New task">
            <button type="button" class="remove-task-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="34px" width="34px" fill="#e3e3e3"><path d="M8.4,17L7,15.6L10.6,12L7,8.42l1.4-1.4l3.6,3.6l3.58-3.6l1.4,1.4L13.38,12l3.6,3.6L15.58,17L12,13.4L8.4,17Z"/></svg></button>`;
        container.appendChild(taskGroup);
    }
    const removeBtn = e.target.closest('.remove-task-btn');
    if (removeBtn) {
        removeBtn.closest('.task-input-group').remove();
    }
});
document.addEventListener('input', (e) => {
    if (e.target.name === 'minutes') {
        let val = parseInt(e.target.value, 10);
        if (val > 59) e.target.value = 59;
        if (val < 0) e.target.value = '';
    }
});
document.addEventListener('input', (e) => {
    if (e.target.name === 'hours') {
        let val = parseInt(e.target.value, 10);
        if (val > 99) e.target.value = 99;
        if (val < 0) e.target.value = '';
    }
});



    const hoursInput = document.querySelector('input[name="hours"]');
    const minutesInput = document.querySelector('input[name="minutes"]');
    const secondsInput = document.querySelector('input[name="seconds"]');
    const canvas = document.getElementById("time-ruler");
    const ctx = canvas.getContext("2d");

    const MIN_SECONDS = 300;
    const PX_PER_MINUTE = 18;
    let currentSeconds = 300;
    let lastMinute = 5;
    let cssWidth = 300;
    let cssHeight = 75;

    // 1. Auto-resize internal canvas resolution for crisp Retina/responsive rendering
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cssWidth = rect.width;
        cssHeight = rect.height;
        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawRuler();
    }

    new ResizeObserver(resizeCanvas).observe(canvas);

    // Subtle mechanical click
    let audioCtx = null;
    function playTick() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.015);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.016);
    }

    function drawRuler() {
        const w = cssWidth;
        const h = cssHeight;
        const centerX = w / 2;

        ctx.clearRect(0, 0, w, h);

        const currentMinutes = currentSeconds / 60;
        const visibleMinutes = Math.ceil(w / PX_PER_MINUTE / 2) + 2;
        const startMin = Math.max(0, Math.floor(currentMinutes - visibleMinutes));
        const endMin = Math.ceil(currentMinutes + visibleMinutes);

        ctx.textAlign = "center";
        ctx.font = "bold 12px system-ui, sans-serif";

        for (let m = startMin; m <= endMin; m++) {
            const x = centerX + (m - currentMinutes) * PX_PER_MINUTE;
            const isMajor = m % 5 === 0;
            const isHour = m % 60 === 0;

            ctx.beginPath();
            ctx.moveTo(x, h - 8);
            ctx.lineTo(x, h - (isHour ? h * 0.48 : isMajor ? h * 0.38 : h * 0.24));
            ctx.strokeStyle = isHour ? "#ff4d4d" : isMajor ? "#ffffff" : "#666666";
            ctx.lineWidth = isMajor ? 2 : 1;
            ctx.stroke();

            if (isMajor) {
                ctx.fillStyle = isHour ? "#ff4d4d" : "#cccccc";
                const label = (m > 0 && isHour) ? `${m / 60}h` : `${m}m`;
                ctx.fillText(label, x, Math.min(24, h * 0.32));
            }
        }

        // Fixed Center Red Needle
        ctx.beginPath();
        ctx.moveTo(centerX, 0);
        ctx.lineTo(centerX, h);
        ctx.strokeStyle = "#ec0a0a";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#ec0a0a";
        ctx.beginPath();
        ctx.moveTo(centerX - 6, 0);
        ctx.lineTo(centerX + 6, 0);
        ctx.lineTo(centerX, 8);
        ctx.closePath();
        ctx.fill();
    }

    function updateInputsFromSeconds(sec) {
        const rounded = Math.round(sec);
        hoursInput.value = String(Math.floor(rounded / 3600)).padStart(2, "0");
        minutesInput.value = String(Math.floor((rounded % 3600) / 60)).padStart(2, "0");
        secondsInput.value = String(rounded % 60).padStart(2, "0");
    }

    function syncRulerFromInputs() {
        const total = (parseInt(hoursInput.value || 0) * 3600) +
                      (parseInt(minutesInput.value || 0) * 60) +
                      parseInt(secondsInput.value || 0);
        currentSeconds = Math.max(MIN_SECONDS, total);
        drawRuler();
    }

    // 2. Smooth Touch & Mouse Drag with Momentum Inertia
    let isDragging = false;
    let prevX = 0;
    let velocity = 0;
    let lastTime = 0;
    let inertiaFrame = null;

    function applyDelta(deltaX) {
        const deltaSeconds = (-deltaX / PX_PER_MINUTE) * 60;
        currentSeconds = Math.max(MIN_SECONDS, currentSeconds + deltaSeconds);
        updateInputsFromSeconds(currentSeconds);
        drawRuler();

        const currentMin = Math.floor(currentSeconds / 60);
        if (currentMin !== lastMinute) {
            playTick();
            lastMinute = currentMin;
        }
    }

    function snapToMinute() {
        currentSeconds = Math.round(currentSeconds / 60) * 60;
        updateInputsFromSeconds(currentSeconds);
        drawRuler();
    }

    function runInertia() {
        if (Math.abs(velocity) < 0.2) {
            snapToMinute();
            return;
        }
        applyDelta(velocity);
        velocity *= 0.92; // Friction decay
        inertiaFrame = requestAnimationFrame(runInertia);
    }

    canvas.addEventListener("pointerdown", (e) => {
        cancelAnimationFrame(inertiaFrame);
        isDragging = true;
        prevX = e.clientX;
        lastTime = performance.now();
        velocity = 0;
        canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const now = performance.now();
        const deltaX = e.clientX - prevX;
        const dt = Math.max(1, now - lastTime);

        velocity = (deltaX / dt) * 16; // Track px per frame for flick momentum
        prevX = e.clientX;
        lastTime = now;

        applyDelta(deltaX);
    });

    function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        if (canvas.hasPointerCapture(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
        }
        inertiaFrame = requestAnimationFrame(runInertia);
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        cancelAnimationFrame(inertiaFrame);
        const step = e.deltaY > 0 ? -60 : 60;
        currentSeconds = Math.max(MIN_SECONDS, currentSeconds + step);
        updateInputsFromSeconds(currentSeconds);
        drawRuler();
        playTick();
    }, { passive: false });

    [hoursInput, minutesInput, secondsInput].forEach(inp => {
        inp.addEventListener("input", () => {
            cancelAnimationFrame(inertiaFrame);
            syncRulerFromInputs();
        });
    });

    syncRulerFromInputs();
    resizeCanvas();
</script>
{% block script %} {{ super() }} {% endblock %}
{% endblock content %}
