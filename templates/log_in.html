{% extends "layout.html" %}
{% block head %}

<style>
     .main-container{
       margin:0;
       min-height:70vh;
       display:flex;
       justify-content:center;
       align-items:center;
       background:#ffffff;
     }
     .main{
       text-align: center;
     }
     #signing_container {
        display:flex; 
        justify-content: center; 
        align-items:center; 
        flex-direction:column; 
        gap: 10px;
     }
      h1,h2{
            text-align:center;
     }
     a{
      text-decoration:none;
     }
      .input{
        text-align: center;
        width: 500px;
        height: 40px;
        font-size: 16px;
        padding: 5px;
        background-color:#ebe3e3e5;
        border:2px solid black;
        border-radius:8px;
        border-color: black;

      }
       .submit{
            width: 200px;
            height: 40px;
            background:#6d4aff;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        @media (max-width: 510px){
          .input{
            width:250px;
          }
        }
        .dark, .dark .main-container{
          background-color: #121212;
        }
        .dark h1, .dark label{
          color:white;
        }
</style>
{% endblock head %}
{% block content %}

{% block nav %} {{super()}} {% endblock nav %}

<div class="main-container">
  <div class="main">
      <h1>Log in to your account</h1>
      <form action="{{ url_for('log_in') }}" method="POST">
          <div id="signing_container">
              <input class="input" type="text" name="username" placeholder="Email" required>
              <input class="input" type="password" name="password" placeholder="Password" required>
              <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px;">
                  <input type="checkbox" onchange="this.form.password.type=this.checked?'text':'password'">
                  <label for="show-pass" style="font-size: 12px; cursor: pointer; user-select: none;">Show password</label>
              </div>
              <input class="submit" type="submit" value="Log in">
              {% if error %}
                <p style="color:red;">{{ error }}</p>
              {% endif %}
              <a href="{{ url_for('sign_up') }}">Don't have an account?</a>
          </div>
      </form>
  </div>
</div>
<script>
  const themeBtn = document.getElementById("theme-switch");
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
});
</script>
{% endblock content %}
